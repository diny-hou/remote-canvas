<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RemoteCanvas</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 id="host-name">PC</h1>
          <p id="endpoint">…</p>
        </div>
        <span class="status" id="service-state">Live</span>
      </header>

      <button class="primary" id="pair-button">Add device</button>
      <button class="ghost" id="update-button">Update</button>
      <button class="ghost" id="rotate-button">Rotate keys</button>

      <section class="pairing hidden" id="pairing-card" aria-live="polite">
        <div class="qr" id="pairing-qr" aria-label="Pairing QR code"></div>
        <p class="code" id="pairing-code">------</p>
        <p class="meta"><span id="pairing-expiry">5 min</span> · <code id="pairing-endpoint">—</code></p>
        <button class="ghost" id="close-pairing">Done</button>
      </section>

      <p class="error hidden" id="error-message"></p>
    </main>
  </body>
</html>
