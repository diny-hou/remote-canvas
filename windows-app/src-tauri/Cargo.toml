[package]
name = "remote-canvas-host"
version = "0.1.0"
description = "RemoteCanvas Windows host shell"
authors = ["RemoteCanvas"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "remote_canvas_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
